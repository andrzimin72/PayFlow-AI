# =============================================================================
# Pytest Configuration for PayFlow AI
# =============================================================================
# Comprehensive test configuration with coverage, markers, and reporting

[pytest]
# ==========================================
# TEST DISCOVERY
# ==========================================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ==========================================
# EXECUTION OPTIONS
# ==========================================
# Default command-line options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --showlocals
    --color=yes
    --durations=10
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=70

# ==========================================
# ASYNCIO CONFIGURATION
# ==========================================
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# ==========================================
# CUSTOM MARKERS
# ==========================================
markers =
    # Speed markers
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast (select with '-m fast')

    # Test type markers
    unit: marks tests as unit tests
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    e2e: marks tests as end-to-end tests
    smoke: marks tests as smoke tests (quick sanity checks)
    performance: marks tests as performance benchmarks (deselect with '-m "not performance"')

    # Component markers
    ai: marks tests related to AI/ML functionality
    api: marks tests related to API endpoints
    database: marks tests related to database operations
    security: marks tests related to security features
    risk: marks tests related to risk management
    webhook: marks tests related to webhook processing

    # Environment markers
    requires_elasticsearch: marks tests that require Elasticsearch
    requires_paypal: marks tests that require PayPal API access
    requires_huggingface: marks tests that require Hugging Face API
    requires_network: marks tests that require network access

    # Priority markers
    critical: marks tests as critical (must pass before deployment)
    flaky: marks tests as known to be flaky (needs investigation)

# ==========================================
# BENCHMARK CONFIGURATION (pytest-benchmark)
# ==========================================
# Benchmark output options (can be overridden on command line)
benchmark_disable = false
benchmark_timer = time.perf_counter
benchmark_min_rounds = 5
benchmark_warmup = on
benchmark_warmup_iterations = 1

# Benchmark comparison settings
benchmark_compare = false
benchmark_compare_fail = firstrow

# Benchmark output formats (uncomment to enable by default)
# benchmark_json = benchmarks.json
# benchmark_csv = benchmarks.csv
# benchmark_histogram = benchmarks/

# ==========================================
# FILTER WARNINGS
# ==========================================
filterwarnings =
    # Ignore specific warnings
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:transformers.*
    ignore::UserWarning:prophet.*
    ignore::ResourceWarning

    # Convert specific warnings to errors (strict mode)
    error::RuntimeWarning

    # Default behavior for other warnings
    default

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s (%(filename)s:%(lineno)s): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ==========================================
# COVERAGE CONFIGURATION
# ==========================================
[coverage:run]
source = .
omit =
    */tests/*
    */test_*
    */migrations/*
    */venv/*
    */.venv/*
    */site-packages/*
    setup.py
    conftest.py
    */__init__.py

[coverage:report]
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover

    # Don't complain about missing debug-only code
    def __repr__
    if self\.debug

    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError

    # Don't complain if non-runnable code isn't run
    if 0:
    if __name__ == .__main__.

    # Don't complain about abstract methods
    @abstractmethod

    # Don't complain about type checking imports
    if TYPE_CHECKING:

    # Don't complain about ellipsis
    \.\.\.

ignore_errors = True

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

# ==========================================
# MYPY CONFIGURATION
# ==========================================
[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
ignore_missing_imports = True

# ==========================================
# FLAKE8 CONFIGURATION
# ==========================================
[flake8]
max-line-length = 120
max-complexity = 15
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    build,
    dist,
    venv,
    .venv,
    .eggs,
    *.egg,
    htmlcov,
    .mypy_cache,
    .pytest_cache
per-file-ignores =
    __init__.py:F401
    tests/*:D,S101

# ==========================================
# BLACK CONFIGURATION
# ==========================================
[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | htmlcov
)/
'''

# ==========================================
# ISORT CONFIGURATION
# ==========================================
[tool.isort]
profile = black
line_length = 120
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True